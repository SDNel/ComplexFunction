<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Function Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Complex Function Visualizer</h1>
            <div class="controls">
                <div class="function-input">
                    <label for="function-input">Function f(z) = </label>
                    <input type="text" id="function-input" placeholder="(a z + b)/(c z + d)" value="(a z + b)/(c z + d)">
                    <button id="parse-function">Apply</button>
                </div>
                <div class="mode-controls">
                    <label>
                        <input type="radio" name="mode" value="immediate" checked> Immediate
                    </label>
                    <label>
                        <input type="radio" name="mode" value="parametric"> Parametric
                    </label>
                </div>
                <div class="animation-controls" id="animation-controls" style="display: none;">
                    <div class="video-controls">
                        <button id="play" class="control-btn" title="Play">▶️</button>
                        <button id="pause" class="control-btn" title="Pause">⏸️</button>
                        <button id="stop" class="control-btn" title="Stop">⏹️</button>
                        <button id="restart" class="control-btn" title="Restart">⏮️</button>
                    </div>
                    <div class="progress-container">
                        <label for="progress">Progress:</label>
                        <input type="range" id="progress" min="0" max="100" step="0.1" value="0" class="progress-slider">
                        <span id="progress-display">0%</span>
                    </div>
                    <div class="speed-container">
                        <label for="speed">Speed:</label>
                        <input type="range" id="speed" min="0.1" max="5" step="0.1" value="1">
                        <span id="speed-display">1.0x</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="canvas-container">
                <div class="window domain-window">
                    <h3>Domain (Complex Plane)</h3>
                    <canvas id="domain-canvas" width="600" height="600"></canvas>
                    <div class="canvas-info">
                        <span id="domain-center">Center: (0, 0)</span>
                        <span id="domain-scale">Scale: 1.0</span>
                    </div>
                </div>

                <div class="window range-window">
                    <h3>Range (Transformed)</h3>
                    <canvas id="range-canvas" width="600" height="600"></canvas>
                    <div class="canvas-info">
                        <span id="range-center">Center: (0, 0)</span>
                        <span id="range-scale">Scale: 1.0</span>
                    </div>
                </div>
            </div>

            <div class="parameters-panel" id="parameters-panel">
                <h3>Parameters</h3>
                <div id="parameter-sliders"></div>
            </div>

            <div class="triangle-panel" id="triangle-panel">
                <h3>Shape Demonstration</h3>
                <div class="triangle-controls">
                    <div class="triangle-preset">
                        <label for="triangle-type">Triangle Type:</label>
                        <select id="triangle-type">
                            <option value="equilateral">Equilateral (60°-60°-60°)</option>
                            <option value="right">Right Triangle (90°-45°-45°)</option>
                            <option value="isosceles">Isosceles (70°-55°-55°)</option>
                            <option value="acute">Acute Scalene (80°-60°-40°)</option>
                            <option value="obtuse">Obtuse (120°-30°-30°)</option>
                        </select>
                    </div>

                    <div class="angle-controls">
                        <div class="angle-slider">
                            <label for="angle-a">Angle A (red):</label>
                            <input type="range" id="angle-a" min="5" max="170" step="1" value="60">
                            <span id="angle-a-display">60°</span>
                        </div>
                        <div class="angle-slider">
                            <label for="angle-b">Angle B (blue):</label>
                            <input type="range" id="angle-b" min="5" max="170" step="1" value="60">
                            <span id="angle-b-display">60°</span>
                        </div>
                        <div class="angle-display">
                            <label>Angle C (green):</label>
                            <span id="angle-c-display">60°</span>
                        </div>
                    </div>

                    <div class="triangle-properties">
                        <div class="size-control">
                            <label for="triangle-size">Size:</label>
                            <input type="range" id="triangle-size" min="0.1" max="2.0" step="0.1" value="0.5">
                            <span id="size-display">0.5</span>
                        </div>
                        <div class="position-control">
                            <label>Position:</label>
                            <button id="place-triangle" class="control-btn">Click to Place</button>
                            <span id="triangle-position">(0, 0)</span>
                        </div>
                    </div>

                    <div class="triangle-toggle">
                        <label>
                            <input type="checkbox" id="show-triangle" checked> Show Triangle
                        </label>
                        <label>
                            <input type="checkbox" id="show-angles" checked> Show Angle Measurements
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="export-controls">
            <div class="export-options">
                <h3>Export Options</h3>
                <div class="resolution-selector">
                    <label for="export-resolution">PNG Resolution:</label>
                    <select id="export-resolution">
                        <option value="1200x600">Standard (1200×600)</option>
                        <option value="2400x1200">High (2400×1200)</option>
                        <option value="4800x2400" selected>Ultra (4800×2400)</option>
                        <option value="7200x3600">Publication (7200×3600)</option>
                        <option value="9600x4800">Maximum (9600×4800)</option>
                    </select>
                </div>
                <div class="export-buttons">
                    <button id="export-svg">Export as SVG (2 files)</button>
                    <button id="export-png">Export as PNG (2 files)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="complex.js"></script>
    <script src="parser.js"></script>
    <script src="triangle.js"></script>
    <script src="renderer.js"></script>
    <script src="app.js"></script>
</body>
</html>
